version: 1
name: feature_delivery
steps:
  - id: plan
    type: agent
    provider: claude
    action: plan
  - id: implement
    type: agent
    provider: codex
    action: implement
    depends_on: [plan]
    # AgentBoard Pro adds: retry, timeout_seconds, condition, external and git_pull_request steps.
  - id: test
    type: command
    command: rails_test
    depends_on: [implement]
  - id: review
    type: agent
    provider: claude
    action: review
    depends_on: [test]
  - id: approval
    type: human_approval
    depends_on: [review]
